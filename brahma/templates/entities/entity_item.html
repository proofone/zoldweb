{% with obj_photo=obj.avatar_photo %}{% endwith %}
<div class="d-flex">
    <div class="flex-shrink-0">
        <img src="{{ obj_photo.url|default:'' }}" alt="Kép">
    </div>
    <div class="flex-grow-1 ms-3">
        <div>
            <span class="h5 me-2"><a href="{{ obj.get_absolute_url }}" class="stretched-link text-decoration-none">{{ obj }}</a></span>
            <small>{{ type }}</small>
        </div>
        <span>{{ obj.hometown }}</span>
        <span class="float-end">{{ obj.founded.year }}</span>
    </div>
</div>
